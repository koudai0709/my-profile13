<main class="counter-card" data-sign="zero">
  <h1>カウンター</h1>
  <output id="count" aria-label="現在のカウント" aria-live="polite" aria-atomic="true">0</output>
  <div class="controls" aria-label="カウント操作">
    <button type="button" data-step="-5">-5</button>
    <button type="button" data-step="-1">-1</button>
    <button type="button" data-step="1">+1</button>
    <button type="button" data-step="5">+5</button>
  </div>
  <button class="reset" type="button" data-reset>リセット</button>
</main>
